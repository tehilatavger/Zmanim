name: Deploy Full-Stack Node.js to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'my-dayTimes-app-2026'
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          # Use the server's lockfile for caching
          cache-dependency-path: server/package-lock.json

      - name: Build and Install Backend
        run: |
          cd server
          npm install
          # This builds your TS if you have a build script
          npm run build --if-present 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # We upload the entire server folder (which includes /public)
          path: ./server 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure WebApp'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
